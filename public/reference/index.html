<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1030;
    --ink-deep:#120A1F;
    --panel:#341A4A;
    --panel-light:#3E2158;
    --parchment:#F0DCC8;
    --parchment-dim:rgba(240,220,200,.58);
    --parchment-faint:rgba(240,220,200,.34);
    --rose:#D9667A;
    --gold:#E7B24E;
    --gold-soft:rgba(231,178,78,.35);
    --glass-fill:rgba(255,255,255,.045);
    --glass-fill-strong:rgba(255,255,255,.075);
    --glass-border:rgba(231,178,78,.22);
    --shadow-glow:0 24px 70px -24px rgba(0,0,0,.65);
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(120% 100% at 12% -10%, #2A1740 0%, transparent 55%),
      radial-gradient(90% 80% at 100% 110%, #241338 0%, transparent 50%),
      var(--ink);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--gold); color:var(--ink); }

  /* ---------- Ambient orbs ---------- */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:.32;
    z-index:0;
    pointer-events:none;
  }
  .orb.o1{ width:420px; height:420px; background:var(--gold); top:-140px; left:-120px; animation:drift1 22s ease-in-out infinite alternate; }
  .orb.o2{ width:360px; height:360px; background:var(--rose); bottom:-140px; right:-100px; animation:drift2 26s ease-in-out infinite alternate; }
  .orb.o3{ width:220px; height:220px; background:var(--gold); top:40%; right:8%; opacity:.16; animation:drift1 18s ease-in-out infinite alternate-reverse; }

  @keyframes drift1{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(40px,30px) scale(1.08); } }
  @keyframes drift2{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(-30px,-40px) scale(1.1); } }

  @media (prefers-reduced-motion: reduce){
    .orb{ animation:none !important; }
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }

  .wrap{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 5vw;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:"";
    width:28px;
    height:1px;
    background:var(--gold);
    opacity:0.6;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(26px, 4vw, 38px);
    margin:0 0 8px;
    text-align:center;
    letter-spacing:-0.01em;
  }

  /* ================= Lock screen ================= */
  #lockScreen{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:380px;
  }
  .lockCard{
    width:100%;
    background:linear-gradient(155deg, var(--glass-fill-strong), var(--glass-fill));
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--glass-border);
    border-radius:26px;
    padding:38px 30px 30px;
    box-shadow:var(--shadow-glow);
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .lockCard::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,.10) 0%, transparent 32%);
    pointer-events:none;
  }
  .lockIcon{
    width:52px; height:52px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%, var(--panel-light), var(--panel));
    border:1px solid var(--glass-border);
    box-shadow:0 0 0 6px rgba(231,178,78,.06), 0 0 24px -4px var(--gold-soft);
    animation:pulseRing 3.2s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{ box-shadow:0 0 0 6px rgba(231,178,78,.06), 0 0 24px -4px var(--gold-soft); }
    50%{ box-shadow:0 0 0 10px rgba(231,178,78,.10), 0 0 32px 2px var(--gold-soft); }
  }
  .lockIcon svg{ width:22px; height:22px; }

  #lockScreen h1{ margin-bottom:6px; }
  .lockSub{
    font-size:13px;
    color:var(--parchment-dim);
    margin-bottom:26px;
  }

  #pwForm{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
  }
  .pwField{ position:relative; }
  #pwInput{
    width:100%;
    font-family:'Space Mono', monospace;
    font-size:18px;
    letter-spacing:0.28em;
    text-align:center;
    padding:15px 16px;
    border-radius:12px;
    border:1px solid rgba(240,220,200,0.18);
    background:rgba(0,0,0,.18);
    color:var(--parchment);
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  #pwInput::placeholder{ color:var(--parchment-faint); letter-spacing:0.2em; }
  #pwInput:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(231,178,78,.14);
  }
  #pwSubmit{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:14px 16px;
    border-radius:12px;
    border:none;
    background:linear-gradient(135deg, #F2C468, var(--gold));
    color:var(--ink);
    cursor:pointer;
    transition:transform .12s ease, filter .2s ease, opacity .2s ease;
  }
  #pwSubmit:hover{ filter:brightness(1.06); }
  #pwSubmit:active{ transform:scale(.98); }
  #pwSubmit:disabled{ opacity:0.55; cursor:default; transform:none; }
  #pwSubmit:focus-visible, #pwInput:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  #pwError{
    color:var(--rose);
    font-size:13px;
    text-align:center;
    min-height:18px;
    margin-top:12px;
  }

  .shake{ animation:shake .4s ease; }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-5px); }
    40%,60%{ transform:translateX(5px); }
  }

  /* ================= App shell ================= */
  #app{
    display:none;
    width:100%;
    max-width:1000px;
    opacity:0;
    transform:translateY(10px);
  }
  #app.visible{
    display:block;
    animation:fadeUp .5s ease forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .appHeader{ text-align:center; margin-bottom:34px; }

  .layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:26px;
    align-items:start;
  }
  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; }
    .playerPane{ order:1; }
    .playlistPane{ order:2; }
  }

  /* ---------- Playlist pane ---------- */
  .playlistPane{
    background:linear-gradient(160deg, var(--glass-fill-strong), var(--glass-fill));
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    border-radius:22px;
    padding:16px;
    box-shadow:var(--shadow-glow);
  }
  .searchWrap{
    position:relative;
    margin-bottom:12px;
  }
  .searchWrap svg{
    position:absolute;
    left:13px; top:50%;
    transform:translateY(-50%);
    width:15px; height:15px;
    color:var(--parchment-dim);
  }
  #searchInput{
    width:100%;
    padding:11px 12px 11px 36px;
    border-radius:12px;
    border:1px solid rgba(240,220,200,0.14);
    background:rgba(0,0,0,.18);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  #searchInput::placeholder{ color:var(--parchment-faint); }
  #searchInput:focus{ border-color:var(--gold); box-shadow:0 0 0 4px rgba(231,178,78,.12); }

  .trackList{
    list-style:none;
    margin:0; padding:0;
    max-height:420px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .trackList::-webkit-scrollbar{ width:6px; }
  .trackList::-webkit-scrollbar-thumb{ background:rgba(231,178,78,.25); border-radius:6px; }

  .track{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 10px;
    border-radius:12px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .track:hover{ background:rgba(255,255,255,.05); }
  .track:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }
  .track.active{
    background:linear-gradient(90deg, rgba(231,178,78,.16), rgba(231,178,78,.03));
  }

  .track-num{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--parchment-faint);
    width:18px;
    flex-shrink:0;
    text-align:center;
  }
  .track.active .track-num{ display:none; }

  .track-eq{
    display:none;
    width:18px; height:14px;
    flex-shrink:0;
    align-items:flex-end;
    justify-content:center;
    gap:2px;
  }
  .track.active .track-eq{ display:flex; }
  .track-eq span{
    width:3px;
    background:var(--gold);
    border-radius:1px;
    height:4px;
  }
  .track.active.playing .track-eq span{ animation:eq 0.9s ease-in-out infinite; }
  .track-eq span:nth-child(1){ animation-delay:0s; }
  .track-eq span:nth-child(2){ animation-delay:.2s; }
  .track-eq span:nth-child(3){ animation-delay:.4s; }
  @keyframes eq{
    0%,100%{ height:4px; }
    50%{ height:13px; }
  }

  .track-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .track-title{
    font-size:13.5px;
    font-weight:500;
    color:var(--parchment);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track.active .track-title{ color:var(--gold); }
  .track-artist{
    font-size:11.5px;
    color:var(--parchment-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-artist:empty{ display:none; }

  .favBtn{
    background:none;
    border:none;
    color:var(--parchment-faint);
    cursor:pointer;
    padding:4px;
    flex-shrink:0;
    display:flex;
    transition:color .15s ease, transform .15s ease;
  }
  .favBtn:hover{ color:var(--rose); transform:scale(1.1); }
  .favBtn svg{ width:15px; height:15px; }
  .favBtn.active{ color:var(--rose); }
  .favBtn.active svg{ fill:var(--rose); }

  .emptyState{
    padding:26px 10px;
    text-align:center;
    color:var(--parchment-dim);
    font-size:13px;
  }

  /* ---------- Player pane ---------- */
  .playerCard{
    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg, var(--glass-fill-strong), var(--glass-fill));
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--glass-border);
    border-radius:26px;
    padding:30px;
    box-shadow:var(--shadow-glow);
  }
  .playerCard::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,.10) 0%, transparent 30%);
    pointer-events:none;
  }

  .playerTop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
    position:relative;
    z-index:1;
  }
  .eqIconTop{ display:flex; gap:3px; align-items:flex-end; height:16px; }
  .eqIconTop span{ width:3px; background:var(--gold); border-radius:1px; height:6px; opacity:.6; }

  .art{
    width:100%;
    aspect-ratio:1/1;
    max-height:260px;
    border-radius:18px;
    background:linear-gradient(150deg, rgba(231,178,78,.35), rgba(217,102,122,.25)), var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
    position:relative;
    z-index:1;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .art svg{ width:56px; height:56px; color:rgba(240,220,200,.65); }

  .meta{ text-align:center; margin-bottom:22px; position:relative; z-index:1; }
  .trackTitleNow{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    margin-bottom:4px;
  }
  .trackArtistNow{ font-size:13px; color:var(--parchment-dim); }

  .progressRow{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    position:relative;
    z-index:1;
  }
  .time{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--parchment-dim);
    width:36px;
    flex-shrink:0;
  }
  .time.right{ text-align:right; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:4px;
    background:linear-gradient(to right, var(--gold) 0%, var(--gold) var(--val,0%), rgba(255,255,255,.14) var(--val,0%));
    outline:none;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 4px rgba(231,178,78,.18);
    cursor:pointer;
    transition:transform .12s ease;
  }
  input[type="range"]:hover::-webkit-slider-thumb{ transform:scale(1.15); }
  input[type="range"]::-moz-range-thumb{
    width:13px; height:13px;
    border-radius:50%;
    background:var(--gold);
    border:none;
    box-shadow:0 0 0 4px rgba(231,178,78,.18);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-track{
    height:4px; border-radius:4px;
    background:rgba(255,255,255,.14);
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb{ outline:2px solid var(--gold); outline-offset:2px; }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:22px;
    position:relative;
    z-index:1;
  }
  .ctrlBtn{
    background:none;
    border:none;
    color:var(--parchment);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
    border-radius:50%;
    transition:transform .12s ease, background .15s ease;
  }
  .ctrlBtn:hover{ background:rgba(255,255,255,.06); }
  .ctrlBtn:active{ transform:scale(.92); }
  .ctrlBtn svg{ width:18px; height:18px; }
  .ctrlBtn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  #playBtn{
    width:56px; height:56px;
    background:linear-gradient(135deg, #F2C468, var(--gold));
    color:var(--ink);
  }
  #playBtn:hover{ background:linear-gradient(135deg, #F2C468, var(--gold)); filter:brightness(1.05); }
  #playBtn svg{ width:20px; height:20px; }

  .volumeRow{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:1;
  }
  .volumeRow svg{ width:15px; height:15px; color:var(--parchment-dim); flex-shrink:0; }

  @media (max-width:480px){
    .playerCard{ padding:24px 20px; }
    .art{ max-height:220px; }
  }
</style>
</head>
<body>

<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="wrap">

  <div id="lockScreen">
    <div class="lockCard">
      <div class="lockIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--gold)">
          <rect x="5" y="11" width="14" height="9" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <div class="eyebrow" style="justify-content:center;">Private</div>
      <h1>Enter Password</h1>
      <p class="lockSub">This collection is locked. Enter the password to listen.</p>
      <form id="pwForm">
        <div class="pwField">
          <input type="password" id="pwInput" placeholder="••••••••" autocomplete="off" />
        </div>
        <button type="submit" id="pwSubmit">Unlock</button>
      </form>
      <div id="pwError"></div>
    </div>
  </div>

  <div id="app">
    <div class="appHeader">
      <div class="eyebrow" style="justify-content:center;">Private Collection</div>
      <h1>Music</h1>
    </div>

    <div class="layout">
      <aside class="playlistPane">
        <div class="searchWrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.3-4.3"/>
          </svg>
          <input id="searchInput" placeholder="Search tracks…" autocomplete="off" />
        </div>
        <ul class="trackList" id="trackList"></ul>
      </aside>

      <main class="playerPane">
        <div class="playerCard">
          <div class="playerTop">
            <div class="eqIconTop" aria-hidden="true"><span></span><span></span><span></span></div>
            <button class="favBtn" id="npFavBtn" aria-label="Add current track to favorites">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M12 21s-7.5-4.6-10-9.1C.5 8.5 2 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5 18 5 19.5 8.5 22 11.9 19.5 16.4 12 21 12 21z"/>
              </svg>
            </button>
          </div>

          <div class="art" id="artArea">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
          </div>

          <div class="meta">
            <div class="trackTitleNow" id="npTitle">No track selected</div>
            <div class="trackArtistNow" id="npArtist">Choose a song from the playlist</div>
          </div>

          <div class="progressRow">
            <span class="time" id="curTime">0:00</span>
            <input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek" />
            <span class="time right" id="durTime">0:00</span>
          </div>

          <div class="controls">
            <button class="ctrlBtn" id="prevBtn" aria-label="Previous track">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L10 12l10 6z"/></svg>
            </button>
            <button class="ctrlBtn" id="playBtn" aria-label="Play">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrlBtn" id="nextBtn" aria-label="Next track">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg>
            </button>
          </div>

          <div class="volumeRow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 9v6h4l5 5V4L8 9H4z"/>
              <path d="M17 8a5 5 0 0 1 0 8"/>
            </svg>
            <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume" />
          </div>
        </div>
      </main>
    </div>
  </div>

</div>

<audio id="audioEl" preload="metadata"></audio>

<script>
// The password is checked server-side (see /api/login.js) — it never ships
// to the browser, and the track list/files are only served once a valid
// session cookie is present (see /api/tracks.js).

const pwForm = document.getElementById('pwForm');
const pwInput = document.getElementById('pwInput');
const pwSubmit = document.getElementById('pwSubmit');
const pwError = document.getElementById('pwError');
const lockCard = document.querySelector('.lockCard');
const lockScreen = document.getElementById('lockScreen');
const app = document.getElementById('app');

const trackListEl = document.getElementById('trackList');
const searchInput = document.getElementById('searchInput');
const audioEl = document.getElementById('audioEl');

const npTitle = document.getElementById('npTitle');
const npArtist = document.getElementById('npArtist');
const npFavBtn = document.getElementById('npFavBtn');

const seek = document.getElementById('seek');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const volume = document.getElementById('volume');

const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const HEART_OUTLINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.1C.5 8.5 2 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5 18 5 19.5 8.5 22 11.9 19.5 16.4 12 21 12 21z"/></svg>';
const HEART_FILL = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.1C.5 8.5 2 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5 18 5 19.5 8.5 22 11.9 19.5 16.4 12 21 12 21z"/></svg>';

let tracks = [];
let currentIndex = -1;
let isPlaying = false;
let favorites = loadFavorites();

function loadFavorites(){
  try{
    const raw = localStorage.getItem('music_favorites');
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}
function saveFavorites(){
  try{ localStorage.setItem('music_favorites', JSON.stringify([...favorites])); }catch(e){}
}

function parseLabel(label){
  const parts = String(label).split(/\s+[–-]\s+/);
  if(parts.length >= 2){
    return { title: parts[0], artist: parts.slice(1).join(' - ') };
  }
  return { title: label, artist: '' };
}

function formatTime(sec){
  if(!isFinite(sec) || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function renderList(){
  const query = searchInput.value.trim().toLowerCase();
  trackListEl.innerHTML = '';

  const visible = tracks
    .map((t, i) => ({ ...t, index: i }))
    .filter(t => t.label.toLowerCase().includes(query));

  if(tracks.length === 0){
    trackListEl.innerHTML = '<li class="emptyState">No tracks in this collection yet.</li>';
    return;
  }
  if(visible.length === 0){
    trackListEl.innerHTML = '<li class="emptyState">No tracks match your search.</li>';
    return;
  }

  visible.forEach(t => {
    const { title, artist } = parseLabel(t.label);
    const li = document.createElement('li');
    li.className = 'track' + (t.index === currentIndex ? ' active' : '') + (t.index === currentIndex && isPlaying ? ' playing' : '');
    li.dataset.index = t.index;
    li.tabIndex = 0;
    const isFav = favorites.has(t.src);

    li.innerHTML = `
      <span class="track-num">${String(t.index + 1).padStart(2, '0')}</span>
      <span class="track-eq" aria-hidden="true"><span></span><span></span><span></span></span>
      <div class="track-info">
        <span class="track-title">${title}</span>
        <span class="track-artist">${artist}</span>
      </div>
      <button class="favBtn${isFav ? ' active' : ''}" aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}" data-src="${t.src}">
        ${isFav ? HEART_FILL : HEART_OUTLINE}
      </button>
    `;

    li.addEventListener('click', (e) => {
      if(e.target.closest('.favBtn')) return;
      selectTrack(t.index);
    });
    li.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        selectTrack(t.index);
      }
    });

    trackListEl.appendChild(li);
  });

  trackListEl.querySelectorAll('.favBtn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(btn.dataset.src);
    });
  });
}

function toggleFavorite(src){
  if(favorites.has(src)) favorites.delete(src);
  else favorites.add(src);
  saveFavorites();
  renderList();
  if(tracks[currentIndex] && tracks[currentIndex].src === src) updateFavIcon();
}

function updateFavIcon(){
  const t = tracks[currentIndex];
  if(!t){ npFavBtn.innerHTML = HEART_OUTLINE; npFavBtn.classList.remove('active'); return; }
  const isFav = favorites.has(t.src);
  npFavBtn.innerHTML = isFav ? HEART_FILL : HEART_OUTLINE;
  npFavBtn.classList.toggle('active', isFav);
}

function selectTrack(index){
  if(index < 0 || index >= tracks.length) return;
  currentIndex = index;
  const t = tracks[index];
  const { title, artist } = parseLabel(t.label);
  npTitle.textContent = title;
  npArtist.textContent = artist || '—';
  audioEl.src = t.src;
  updateFavIcon();
  renderList();
  playAudio();
}

function playAudio(){
  audioEl.play().catch(() => {});
}
function pauseAudio(){
  audioEl.pause();
}
function togglePlay(){
  if(currentIndex === -1){
    if(tracks.length > 0) selectTrack(0);
    return;
  }
  if(isPlaying) pauseAudio();
  else playAudio();
}
function prevTrack(){
  if(tracks.length === 0) return;
  const next = currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1;
  selectTrack(next);
}
function nextTrack(){
  if(tracks.length === 0) return;
  const next = currentIndex >= tracks.length - 1 ? 0 : currentIndex + 1;
  selectTrack(next);
}

audioEl.addEventListener('play', () => {
  isPlaying = true;
  playBtn.innerHTML = PAUSE_ICON;
  playBtn.setAttribute('aria-label', 'Pause');
  renderList();
});
audioEl.addEventListener('pause', () => {
  isPlaying = false;
  playBtn.innerHTML = PLAY_ICON;
  playBtn.setAttribute('aria-label', 'Play');
  renderList();
});
audioEl.addEventListener('ended', nextTrack);
audioEl.addEventListener('timeupdate', () => {
  if(!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  seek.value = pct;
  seek.style.setProperty('--val', pct + '%');
  curTime.textContent = formatTime(audioEl.currentTime);
});
audioEl.addEventListener('loadedmetadata', () => {
  durTime.textContent = formatTime(audioEl.duration);
});

seek.addEventListener('input', () => {
  seek.style.setProperty('--val', seek.value + '%');
  if(audioEl.duration){
    audioEl.currentTime = (seek.value / 100) * audioEl.duration;
  }
});
volume.addEventListener('input', () => {
  audioEl.volume = volume.value / 100;
  volume.style.setProperty('--val', volume.value + '%');
});
audioEl.volume = volume.value / 100;
volume.style.setProperty('--val', volume.value + '%');

playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', prevTrack);
nextBtn.addEventListener('click', nextTrack);
searchInput.addEventListener('input', renderList);
npFavBtn.addEventListener('click', () => {
  const t = tracks[currentIndex];
  if(t) toggleFavorite(t.src);
});

/* ---------------- Session / auth flow ---------------- */

async function showApp(){
  const res = await fetch('/api/tracks', { credentials: 'include' });
  if(!res.ok){
    pwError.textContent = 'Session expired — please try again.';
    return false;
  }
  const data = await res.json();
  tracks = data.tracks || [];
  renderList();

  lockScreen.style.display = 'none';
  app.classList.add('visible');
  return true;
}

(async function checkExistingSession(){
  try{
    const res = await fetch('/api/tracks', { credentials: 'include' });
    if(res.ok) showApp();
  }catch(e){ /* not logged in yet */ }
})();

pwForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  pwError.textContent = '';
  pwSubmit.disabled = true;

  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ password: pwInput.value }),
    });

    if(res.ok){
      await showApp();
    }else{
      const data = await res.json().catch(() => ({}));
      pwError.textContent = data.error || 'Incorrect password.';
      pwInput.value = '';
      pwInput.focus();
      lockCard.classList.remove('shake');
      void lockCard.offsetWidth;
      lockCard.classList.add('shake');
    }
  }catch(err){
    pwError.textContent = 'Something went wrong — try again.';
  }finally{
    pwSubmit.disabled = false;
  }
});
</script>
